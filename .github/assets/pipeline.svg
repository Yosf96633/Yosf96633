<svg xmlns="http://www.w3.org/2000/svg" width="480" height="832" viewBox="0 0 480 832" role="img" aria-labelledby="title desc">
<title id="title">AutoHunt workflow: parse, discover, score, draft, critique, human review, act. Critique can return to drafting. Submission requires approval.</title>
<desc id="desc">Custom terminal illustration for Muhammad Yousaf. Decorative animation; no live system data.</desc>
<style>
text { font-family: 'DejaVu Sans Mono', Consolas, monospace; }
.cursor { animation: blink 1.6s steps(1,end) infinite; }
.signal { animation: pulse 4s ease-in-out infinite; }
@keyframes blink { 0%,65% {opacity:1} 66%,100% {opacity:0} }
@keyframes pulse { 0%,100% {opacity:.35} 50% {opacity:1} }
.node0 {animation: trace 14s linear 0s infinite;}
.node1 {animation: trace 14s linear 2s infinite;}
.node2 {animation: trace 14s linear 4s infinite;}
.node3 {animation: trace 14s linear 6s infinite;}
.node4 {animation: trace 14s linear 8s infinite;}
.node5 {animation: trace 14s linear 10s infinite;}
.node6 {animation: trace 14s linear 12s infinite;}
@keyframes trace {0%,13% {opacity:1} 14%,100% {opacity:0}}
@media (prefers-reduced-motion: reduce) { * {animation:none !important;} }
</style>
<rect x="1" y="1" width="478" height="830" rx="16" fill="#0B0E14" stroke="#263040"/>
